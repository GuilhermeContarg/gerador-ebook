<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de eBook V2 - Seguro & Escalável</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7f9;
            --ink: #111827;
            --muted: #4b5563;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --panel: #ffffff;
            --stroke: #e5e7eb;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--ink);
            background-color: var(--bg);
        }

        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            gap: 24px;
        }

        .hero {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .hero h1 {
            font-family: "Outfit", sans-serif;
            font-size: 2.5rem;
            margin: 0 0 10px;
            color: #1f2937;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        h2 {
            font-family: "Outfit", sans-serif;
            margin: 0 0 16px;
            font-size: 1.4rem;
        }

        form { display: grid; gap: 16px; }
        .form-group { display: grid; gap: 6px; }
        label { font-weight: 600; font-size: 0.95rem; }

        input, textarea, select {
            font-family: inherit;
            font-size: 1rem;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--stroke);
            background: #f9fafb;
        }

        textarea { min-height: 100px; resize: vertical; }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .option-card input { display: none; }
        .option-card span {
            display: block;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--stroke);
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-card input:checked + span {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        button {
            font-family: "Inter", sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: white; color: var(--accent); border: 1px solid var(--accent); }
        button.secondary:hover { background: #eff6ff; }

        #resultado {
            margin-top: 10px;
            border: 1px solid var(--stroke);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 500px;
            overflow: auto;
            background: #fff;
        }

        .logs {
            margin-top: 20px;
            padding: 15px;
            background: #111827;
            color: #10b981;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
        }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="hero">
            <h1>Gerador de eBook V2</h1>
            <p>Infraestrutura Segura via API Flask | Suporte a Anthropic e Gemini | Design A4 Nativo</p>
        </header>

        <section class="layout">
            <div class="panel">
                <h2>Configurações do E-book</h2>
                <form id="ebookForm">
                    <div class="form-group">
                        <label for="autor">Nome do Autor</label>
                        <input type="text" id="autor" required placeholder="Ex: Machado de Assis" />
                    </div>

                    <div class="form-group">
                        <label for="perfil">Perfil do Escritor / Tom</label>
                        <textarea id="perfil" required placeholder="Ex: Sarcástico, focado no comportamento humano..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="temas">Temas / Estrutura Desejada</label>
                        <textarea id="temas" required placeholder="Ex: Cap 1 - O Início. Cap 2 - O Conflito."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Tema de Design do PDF</label>
                        <div class="option-grid">
                            <label class="option-card"><input type="radio" name="design" value="classico" checked><span>Clássico (Serif)</span></label>
                            <label class="option-card"><input type="radio" name="design" value="moderno"><span>Moderno (Sans)</span></label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Motor de Inteligência Artificial</label>
                        <select id="apiProvider">
                            <option value="anthropic">Anthropic Claude (Sonnet 3.5)</option>
                            <option value="openai">OpenAI (GPT-4o Mini)</option>
                            <option value="gemini">Google Gemini</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="apiKey">API Key (Opcional - Recomenda-se ENV backend)</label>
                        <input type="password" id="apiKey" placeholder="Deixe em branco para usar chave do servidor" />
                        <span id="apiKeyHint" style="font-size: 0.8rem; color: #6b7280; margin-top: 4px;"></span>
                    </div>

                    <button type="submit">Gerar Arquivo A4</button>
                    <div id="status" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
                </form>
            </div>

            <div class="panel">
                <h2>Saída e Logs</h2>
                <div id="acoesEbook" style="display: flex; gap: 10px; margin-bottom: 10px;" hidden>
                    <button id="abrirNovaAba">Imprimir / Salvar PDF</button>
                    <button id="baixarEbook" class="secondary">Exportar HTML Bruto</button>
                </div>

                <div id="resultado">Aguardando geração...</div>

                <div id="logs" class="logs">
                    <div id="logEntries">Terminal Pronto.</div>
                </div>
            </div>
        </section>
    </div>

    <script src="ebook_v2.js"></script>
</body>
</html>
